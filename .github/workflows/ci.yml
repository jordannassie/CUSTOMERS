name: CI

on:
  push:
    branches: [main]
  pull_request:

# Placeholder values: the build and smoke tests need these set, but never reach a real database.
env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Scan before installing: install scripts are how injected packages run.
      - run: bash scripts/scan-payload.sh
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: bash scripts/scan-payload.sh
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run check:auth
      - run: npm run check:rls

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: bash scripts/scan-payload.sh
      - run: npm ci --ignore-scripts
      # npm test starts a local Supabase in Docker and rebuilds it from supabase/migrations.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: bash scripts/scan-payload.sh
      - run: npm ci --ignore-scripts
      - run: npm run build

  e2e:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: bash scripts/scan-payload.sh
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      # DB-backed specs seed their own rows in a local Supabase, like the Unit tests job.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0
      - run: bash scripts/test-db-reset.sh
      # The dev server Playwright starts must use the local stack, not the placeholder env above.
      - env:
          # The admin access spec signs in as these, one per project (tests/e2e/admin-access.spec.ts).
          ADMIN_EMAILS: e2e-admin-desktop@example.test,e2e-admin-mobile@example.test
          # Run scan starts the worker inside the dev server; CI has no WORKER_URL (tests/e2e/overview.spec.ts).
          WORKER_IN_PROCESS: "true"
        run: set -a && source .env.test.local && set +a && npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
