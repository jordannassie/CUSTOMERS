[build]
  command   = "npm run build"
  publish   = ".next"

# Scan worker (B-27), bundled by scripts/build-worker.mjs. Test agencies read recorded answers at run time (D-61).
[functions."scan-worker-background"]
  included_files = ["tests/fixtures/ai-answers/**"]

[build.environment]
  # Same major as CI and package.json engines. Supabase JS needs 22+; 24 is the active LTS.
  NODE_VERSION = "24"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect all requests to Next.js (handled by the plugin above)
# [[redirects]]
#   from   = "/*"
#   to     = "/.netlify/functions/___netlify-handler"
#   status = 200

# Example: set environment variables via Netlify UI or .env files.
# NEVER commit real secrets here.
# [context.production.environment]
#   NEXT_PUBLIC_SUPABASE_URL      = "https://your-project.supabase.co"
#   NEXT_PUBLIC_SUPABASE_ANON_KEY = "your-anon-key"
